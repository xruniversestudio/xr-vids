<script type="importmap">{"imports":{"three":"THREE_BASE/build/three.module.js","three/addons/":"THREE_BASE/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ================= format ================= */
const QS = new URLSearchParams(location.search);
const VERT = QS.get('fmt') === 'v';
const W = VERT ? 1080 : 1920, H = VERT ? 1920 : 1080, DUR = 36, BEAT = .5;
const C = { bg: '#0d0b1d', ink: '#F4EEFA', dim: '#A69FC2', cyan: '#4FC3E0', mag: '#E2367A', violet: '#8B6CF0', purple: '#5B3F8F', cream: '#F8EDE0' };
const AR = '"Cairo", Tahoma, sans-serif', MONO = '"JBM", ui-monospace, monospace';

/* ================= math: every motion is a pure function of t ================= */
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const pr = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const eo = x => 1 - Math.pow(1 - x, 3);
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eob = x => { const c1 = 1.6, c3 = c1 + 1; return x <= 0 ? 0 : 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const bounce = x => { const n = 7.5625, d = 2.75; if (x < 1 / d) return n * x * x; if (x < 2 / d) return n * (x -= 1.5 / d) * x + .75; if (x < 2.5 / d) return n * (x -= 2.25 / d) * x + .9375; return n * (x -= 2.625 / d) * x + .984375; };
const frac = x => x - Math.floor(x);
const step = (u, t0, len = BEAT) => { const k = Math.max(0, (u - t0) / len); return Math.floor(k) + eio(clamp(frac(k) / .6)); };
const AN = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
const rgba = (h, a) => { const n = parseInt(h.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };
const hash = (x, y) => { const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return n - Math.floor(n); };
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);

/* ================= renderer ================= */
const out = document.getElementById('c'); out.width = W; out.height = H; const ctx = out.getContext('2d');
const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = .95;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.localClippingEnabled = true;
const scene = new THREE.Scene(); const BG = new THREE.Color(C.bg); scene.background = BG;
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), .04).texture;
const camera = new THREE.PerspectiveCamera(35, W / H, .02, 400);
const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(W, H, { type: THREE.HalfFloatType, samples: 4 }));
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(W / 2, H / 2), .5, .45, 1.0));
composer.addPass(new OutputPass());

const hemi = new THREE.HemisphereLight(0xb8a8ff, 0x0c0a16, .35); scene.add(hemi);
const key = new THREE.DirectionalLight(0xffffff, 1.7); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.bias = -.0004; key.shadow.normalBias = .02; scene.add(key, key.target);
const rimA = new THREE.PointLight(0x4fc3e0, 12, 20, 2), rimB = new THREE.PointLight(0xe2367a, 9, 20, 2); scene.add(rimA, rimB);

/* ================= materials & helpers ================= */
const M = {
  floor: new THREE.MeshStandardMaterial({ color: 0x15121f, roughness: .3, metalness: .35, envMapIntensity: .4 }),
  frame: new THREE.MeshStandardMaterial({ color: 0x2d2a3c, roughness: .25, metalness: .9, envMapIntensity: .9 }),
  black: new THREE.MeshStandardMaterial({ color: 0x050409, roughness: .2, metalness: .3 }),
  white: new THREE.MeshPhysicalMaterial({ color: 0xe9e6ef, roughness: .32, clearcoat: 1, clearcoatRoughness: .2, envMapIntensity: .55 }),
  matte: new THREE.MeshStandardMaterial({ color: 0x1d1a27, roughness: .7, metalness: .1 }),
  clay: new THREE.MeshStandardMaterial({ color: 0xc4bfd0, roughness: .55, envMapIntensity: .4 }),
  wall: new THREE.MeshStandardMaterial({ color: 0x2a2635, roughness: .92 }),
};
const glossy = (c, o = {}) => new THREE.MeshPhysicalMaterial({ color: c, roughness: .24, clearcoat: 1, clearcoatRoughness: .08, envMapIntensity: .6, ...o });
const glow = (c, i = 2.2) => new THREE.MeshStandardMaterial({ color: 0x000000, emissive: c, emissiveIntensity: i, roughness: 1 });
const additive = (c, o = .2) => new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: o, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, toneMapped: false });
const RB = (w, h, d, r = .04, s = 4) => new RoundedBoxGeometry(w, h, d, s, r);
function mesh(geo, mat, pos, o = {}) { const m = new THREE.Mesh(geo, mat); if (pos) m.position.set(...pos); m.castShadow = o.cast !== false; m.receiveShadow = o.recv !== false; return m; }
function canvasTex(w, h, draw, srgb = true) { const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); const t = new THREE.CanvasTexture(c); if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; t.draw = (...a) => { g.clearRect(0, 0, w, h); draw(g, w, h, ...a); t.needsUpdate = true; }; t.draw(0); return t; }
function between(a, b, r, mat, geoFn) { const A = V3(...a), B = V3(...b), len = A.distanceTo(B); const m = mesh(geoFn ? geoFn(len) : new THREE.CapsuleGeometry(r, len, 6, 16), mat); m.position.copy(A).add(B).multiplyScalar(.5); m.quaternion.setFromUnitVectors(V3(0, 1, 0), B.clone().sub(A).normalize()); return m; }
function rrect(g, x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function vgradTex() { return canvasTex(4, 256, (g) => { const gr = g.createLinearGradient(0, 0, 0, 256); gr.addColorStop(0, '#000'); gr.addColorStop(1, '#fff'); g.fillStyle = gr; g.fillRect(0, 0, 4, 256); }, false); }
const VGRAD = vgradTex();
/* wood plank texture (fixed tone cycle, no random) */
function woodTex(base = [92, 62, 44]) {
  const t = canvasTex(1024, 1024, (g, w, h) => {
    for (let r = 0; r < 16; r++) {
      const off = (r * 389) % 512;
      for (let k = -1; k < 3; k++) {
        const x = off + k * 512, tone = [1, .94, 1.04, .97, 1.02, .95][(r * 5 + k * 3 + 12) % 6];
        g.fillStyle = `rgb(${base.map(v => Math.round(v * tone)).join(',')})`; g.fillRect(x, r * 64, 510, 62);
        g.globalAlpha = .07; g.fillStyle = '#000';
        for (let s = 0; s < 14; s++) g.fillRect(x, r * 64 + 4 + s * 4 + Math.sin(s * 1.7 + r) * 1.5, 510, 1);
        g.globalAlpha = 1;
      }
    }
    g.fillStyle = 'rgba(0,0,0,.35)'; for (let r = 0; r < 16; r++) g.fillRect(0, r * 64 + 62, w, 2);
  });
  t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}

const floor = mesh(new THREE.CircleGeometry(60, 96), M.floor, null, { cast: false }); floor.rotation.x = -Math.PI / 2; scene.add(floor);

/* ================= assets ================= */
const loader = new GLTFLoader(); const MODELS = {}; let MARK;
/* normalise a glTF: real-world metres, standing on y=0, centred on x/z; glass without the transmission pass */
function prep(gltf, o = {}) {
  const root = gltf.scene, box = new THREE.Box3().setFromObject(root), size = box.getSize(new THREE.Vector3());
  const s = o.height ? o.height / size.y : o.width ? o.width / size.x : o.depth ? o.depth / size.z : 1;
  const c = box.getCenter(new THREE.Vector3());
  root.position.set(-c.x * s, -box.min.y * s, -c.z * s); root.scale.setScalar(s);
  root.traverse(n => { if (n.isMesh) { n.castShadow = true; n.receiveShadow = true; const mats = Array.isArray(n.material) ? n.material : [n.material]; mats.forEach(m => { if (m.transmission > 0) { m.transmission = 0; m.transparent = true; m.opacity = .28; m.depthWrite = false; } if (m.envMapIntensity !== undefined) m.envMapIntensity = .8; }); } });
  const g = new THREE.Group(); g.add(root); g.userData.size = size.clone().multiplyScalar(s); return g;
}

/* ================= shared models ================= */
function makePhone(screenMat) {
  const g = new THREE.Group();
  g.add(mesh(RB(.76, 1.56, .085, .1, 6), M.frame));
  g.add(mesh(RB(.72, 1.52, .01, .08, 4), M.black, [0, 0, .039], { cast: false }));
  g.add(mesh(new THREE.PlaneGeometry(.7, 1.5), screenMat, [0, 0, .045], { cast: false }));
  g.add(mesh(RB(.16, .035, .01, .017, 3), M.black, [0, .7, .047], { cast: false }));
  g.add(mesh(RB(.3, .3, .03, .07, 4), M.frame, [-.17, .54, -.055]));
  for (const [x, y] of [[-.235, .6], [-.105, .6], [-.235, .47]]) { const l = mesh(new THREE.CylinderGeometry(.045, .045, .03, 24), M.black, [x, y, -.075]); l.rotation.x = Math.PI / 2; g.add(l); }
  for (const y of [.32, .18]) g.add(mesh(RB(.012, .1, .03, .005, 2), M.frame, [.385, y, 0]));
  return g;
}
function makeFigure(mat) {
  const g = new THREE.Group(), add = m => (g.add(m), m);
  const head = add(mesh(new THREE.SphereGeometry(.112, 32, 24), mat, [0, 1.62, 0])); head.scale.set(1, 1.17, 1.08);
  add(mesh(new THREE.CylinderGeometry(.046, .052, .12, 20), mat, [0, 1.47, 0]));
  const prof = [[0, .88], [.145, .88], [.165, .96], [.145, 1.08], [.13, 1.16], [.155, 1.28], [.195, 1.36], [.2, 1.4], [.155, 1.44], [.055, 1.47], [0, 1.47]].map(([r, y]) => new THREE.Vector2(r, y));
  const torso = add(mesh(new THREE.LatheGeometry(prof, 48), mat)); torso.scale.z = .62;
  for (const s of [-1, 1]) {
    add(between([s * .085, .92, 0], [s * .1, .5, .01], .07, mat)); add(between([s * .1, .5, .01], [s * .1, .09, -.01], .055, mat));
    add(mesh(RB(.09, .06, .23, .03, 3), mat, [s * .1, .03, .05]));
    add(between([s * .21, 1.38, 0], [s * .25, 1.1, .02], .042, mat)); add(between([s * .25, 1.1, .02], [s * .27, .86, .06], .034, mat));
  }
  return g;
}

/* ================= scene registry ================= */
const SC = {};
function def(name, d) { d.group = new THREE.Group(); d.group.visible = false; scene.add(d.group); d.build(d.group); SC[name] = d; return d; }

function buildAll() {
/* ---------------- INTRO: the XR mark rises from a mirror floor ---------------- */
def('intro', {
  build(g) {
    const asp = MARK.image.width / MARK.image.height, w = 2.1, h = w / asp;
    this.logo = new THREE.Group(); g.add(this.logo);
    for (let i = 7; i >= 0; i--) { // stacked layers give the flat mark a machined thickness
      const m = new THREE.MeshStandardMaterial({ map: MARK, transparent: true, alphaTest: .45, roughness: .32, metalness: .15, color: i ? new THREE.Color().setScalar(.32 + .02 * (7 - i)) : 0xffffff, emissive: i ? 0x000000 : 0xffffff, emissiveMap: i ? null : MARK, emissiveIntensity: i ? 0 : .12, side: THREE.DoubleSide });
      const p = mesh(new THREE.PlaneGeometry(w, h), m, [0, 0, -i * .012], { recv: false }); this.logo.add(p);
    }
    this.halo = new THREE.Group(); g.add(this.halo); this.halo.position.set(0, 1.25, -.6);
    [[1.75, C.violet], [1.95, C.cyan], [2.12, C.mag]].forEach(([r, c], i) => { const t = mesh(new THREE.TorusGeometry(r, .006 + i * .002, 8, 160, Math.PI * (1.2 + i * .25)), glow(c, 1.8), null, { cast: false }); t.rotation.z = i * 1.3; this.halo.add(t); });
    this.sweep = new THREE.SpotLight(0xffffff, 0, 12, .35, .6, 1.2); g.add(this.sweep, this.sweep.target);
  },
  update(u) {
    const k = eob(pr(u, .25, 1.5));
    this.logo.position.set(0, lerp(-1.4, 1.25, k) + .03 * Math.sin(u * 2), 0); this.logo.rotation.y = lerp(-.7, 0, eio(pr(u, .25, 1.8))) + .06 * Math.sin(u * 1.4);
    this.halo.children.forEach((r, i) => { r.rotation.z = i * 1.3 + u * (i % 2 ? -.35 : .25); r.scale.setScalar(Math.max(.001, eo(pr(u, .8 + i * .15, 1.6 + i * .15)))); });
    this.sweep.intensity = 30 * pr(u, 1.0, 1.4); this.sweep.position.set(lerp(-4, 4, eio(pr(u, 1.0, 3.2))), 3, 3); this.sweep.target.position.set(0, 1.25, 0);
  },
  cam(u) { return { pos: [0, 1.4, lerp(7.6, 6.6, eio(pr(u, 0, 4)))], look: [0, 1.2, 0], fov: 35 }; },
  light: 'studio', rim: [[-3, 2.5, 1.5], [3, 2, -1]], vOff: -60,
});

/* ---------------- 1 · MARKER: a chronograph rises from a printed card ---------------- */
const PAT = ['110101', '011010', '101100', '010011', '111001', '001110'];
def('s1', {
  build(g) {
    const wood = woodTex([86, 58, 42]); wood.repeat.set(2.5, 2.5);
    const table = mesh(new THREE.PlaneGeometry(14, 14), new THREE.MeshStandardMaterial({ map: wood, roughness: .42, metalness: .05, envMapIntensity: .5 }), [0, .001, 0], { cast: false }); table.rotation.x = -Math.PI / 2; g.add(table);
    const card = canvasTex(1024, 1024, (c, w, h) => {
      c.fillStyle = '#f4f1ea'; c.fillRect(0, 0, w, h); c.fillStyle = '#0b0a10'; c.fillRect(70, 70, 884, 884); c.fillStyle = '#f4f1ea'; c.fillRect(150, 150, 724, 724);
      const s = 724 / 6; c.fillStyle = '#0b0a10'; PAT.forEach((r, y) => [...r].forEach((v, x) => { if (v === '1' && !(x > 1 && x < 4 && y > 1 && y < 4)) c.fillRect(150 + x * s, 150 + y * s, s, s); }));
      c.fillStyle = '#f4f1ea'; c.fillRect(150 + 2 * s, 150 + 2 * s, 2 * s, 2 * s);
      const im = MARK.image, iw = 2 * s - 30, ih = iw * im.height / im.width; c.drawImage(im, 150 + 2 * s + 15, 150 + 2 * s + (2 * s - ih) / 2, iw, ih);
    });
    g.add(mesh(RB(1.7, .025, 1.7, .02, 3), new THREE.MeshStandardMaterial({ color: 0x8f8b86, roughness: .5 }), [0, .013, 0]));
    const top = mesh(new THREE.PlaneGeometry(1.6, 1.6), new THREE.MeshStandardMaterial({ map: card, roughness: .6, color: 0xa9a59e }), [0, .027, 0], { cast: false }); top.rotation.x = -Math.PI / 2; g.add(top);
    // props for scale and realism
    g.add(mesh(new THREE.CylinderGeometry(.16, .13, .34, 48), glossy(0x2a2638), [-1.9, .17, -1.3]));
    g.add(mesh(new THREE.CylinderGeometry(.15, .15, .02, 48), new THREE.MeshStandardMaterial({ color: 0x3b2418, roughness: .3 }), [-1.9, .33, -1.3], { cast: false }));
    g.add(mesh(RB(.9, .05, 1.2, .02, 3), new THREE.MeshStandardMaterial({ color: 0x3a2f55, roughness: .7 }), [2.0, .025, -.9]));
    // phone in the foreground: its screen shows the rear camera's view
    this.rt = new THREE.WebGLRenderTarget(560, 1200, { type: THREE.HalfFloatType });
    this.phone = makePhone(new THREE.MeshBasicMaterial({ map: this.rt.texture })); g.add(this.phone);
    this.feed = new THREE.PerspectiveCamera(50, .7 / 1.5, .02, 60);
    const fg = new THREE.BufferGeometry(); fg.setAttribute('position', new THREE.Float32BufferAttribute(new Array(36).fill(0), 3));
    this.frustum = new THREE.Mesh(fg, additive(C.cyan, 0)); g.add(this.frustum);
    this.brackets = [[-1, -1], [1, -1], [1, 1], [-1, 1]].map(([sx, sz]) => { const b = new THREE.Group(), m = glow(C.cyan, 1.8); b.add(mesh(new THREE.BoxGeometry(.3, .02, .035), m, [-sx * .15, 0, 0], { cast: false }), mesh(new THREE.BoxGeometry(.035, .02, .3), m, [0, 0, -sz * .15], { cast: false })); b.userData = { sx, sz }; g.add(b); return b; });
    this.ring = mesh(new THREE.TorusGeometry(1, .01, 8, 128), additive(C.cyan, 0), [0, .05, 0], { cast: false }); this.ring.rotation.x = Math.PI / 2; g.add(this.ring);
    this.column = mesh(new THREE.CylinderGeometry(.5, .5, 1.6, 64, 1, true), new THREE.MeshBasicMaterial({ color: C.cyan, alphaMap: VGRAD, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, toneMapped: false }), [0, .83, 0], { cast: false }); g.add(this.column);
    this.halo = mesh(new THREE.TorusGeometry(.62, .008, 8, 128), glow(C.cyan, 1.6), [0, .06, 0], { cast: false }); this.halo.rotation.x = Math.PI / 2; g.add(this.halo);
    this.watch = prep(MODELS.ChronographWatch, { height: .62 }); this.pivot = new THREE.Group(); this.pivot.add(this.watch); g.add(this.pivot);
    this.watch.position.y = -.31;
  },
  update(u) {
    const kin = eo(pr(u, 0, 1.0));
    const P = V3(lerp(-2.7, -1.75, kin), lerp(2.1, 1.45, kin), lerp(2.6, 1.85, kin)); this.phone.position.copy(P);
    const cp = camPos(this.cam(u)); this.phone.lookAt(lerp(cp[0], 0, .35), lerp(cp[1], 0, .35), lerp(cp[2], 0, .35)); this.phone.rotateZ(.1);
    this.phone.updateMatrixWorld(true); const lens = V3(-.17, .54, -.08).applyMatrix4(this.phone.matrixWorld);
    const cs = [[-.9, .04, -.9], [.9, .04, -.9], [.9, .04, .9], [-.9, .04, .9]], pos = this.frustum.geometry.attributes.position;
    for (let i = 0; i < 4; i++) { const a = cs[i], b = cs[(i + 1) % 4]; pos.setXYZ(i * 3, lens.x, lens.y, lens.z); pos.setXYZ(i * 3 + 1, ...a); pos.setXYZ(i * 3 + 2, ...b); } pos.needsUpdate = true;
    this.frustum.material.opacity = .06 * pr(u, .7, 1.0) * (1 - pr(u, 1.8, 2.3));
    const kb = eio(pr(u, 1.0, 1.5)); this.brackets.forEach(b => { const s = lerp(1.9, 1, kb); b.position.set(b.userData.sx * .93 * s, .045, b.userData.sz * .93 * s); b.visible = u > .9; });
    const kr = pr(u, 1.5, 2.1); this.ring.scale.setScalar(1 + kr * 1.6); this.ring.material.opacity = u >= 1.5 ? (1 - kr) * .9 : 0;
    const kw = pr(u, 1.5, 2.1);
    this.pivot.position.set(0, lerp(.05, .5, eob(kw)), 0); this.pivot.scale.setScalar(Math.max(.001, eo(pr(u, 1.5, 1.85))));
    this.pivot.rotation.y = -.5 + step(u, 2.1, BEAT * 2) * Math.PI / 2 + .12 * Math.sin(u * 1.2); this.pivot.rotation.x = -.18;
    this.column.material.opacity = .09 * eo(pr(u, 1.5, 2.0)); this.halo.visible = u > 1.5; this.halo.scale.setScalar(.6 + .4 * eo(pr(u, 1.5, 2.0)));
  },
  preRender() {
    this.feed.position.copy(V3(-.17, .54, -.09).applyMatrix4(this.phone.matrixWorld)); this.feed.lookAt(0, .35, 0);
    this.phone.visible = false; renderer.setRenderTarget(this.rt); renderer.render(scene, this.feed); renderer.setRenderTarget(null); this.phone.visible = true;
  },
  labels(u) { return u > 2.3 ? [{ p: [.42, 1.0, 0], t: 'CHRONOGRAPH · 3D', k: eo(pr(u, 2.3, 2.7)), mono: true }] : []; },
  cam(u) { const k = eio(pr(u, 0, 4.5)); return { pos: [lerp(2.6, 1.9, k), lerp(2.1, 1.65, k), lerp(4.6, 3.8, k)], look: [.15, .6, 0], fov: 35 }; },
  light: 'studio', rim: [[-2.5, 2.5, 2], [2.5, 2.5, -2]],
});

/* ---------------- 2 · MARKERLESS: furniture placed in a real room at true scale ---------------- */
def('s2', {
  build(g) {
    const wood = woodTex([120, 86, 58]); wood.repeat.set(2, 2);
    const fl = mesh(new THREE.PlaneGeometry(10, 10), new THREE.MeshStandardMaterial({ map: wood, roughness: .5, envMapIntensity: .4 }), [0, .002, 0], { cast: false }); fl.rotation.x = -Math.PI / 2; g.add(fl);
    const wallM = new THREE.MeshStandardMaterial({ color: 0x34303f, roughness: .93 });
