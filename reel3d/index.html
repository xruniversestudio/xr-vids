<style>

@font-face{ font-family:"Sora"; src:url("fonts/Sora-Regular.ttf") format("truetype"); font-weight:400; }

html,body{margin:0;background:var(--midnight)}
canvas{display:block;width:1080px;height:1920px}

<canvas id="c" width="1080" height="1920"></canvas>
<script type="importmap">{"imports":{"three":"THREE_BASE/build/three.module.js","three/addons/":"THREE_BASE/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ---------------- constants ---------------- */
const W = 1080, H = 1920, FPS = 30, DUR = 24, BEAT = 0.5;
const C = { midnight: '#080C12', graphite: '#17212D', cyan: '#54D8F2', ice: '#E9F1F6', sand: '#E8B97A' };
const CUTS = [3, 8, 10, 15, 20];
const FONT = '"Sora", sans-serif';

/* ---------------- math (all motion is a pure function of t) ---------------- */
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const pr = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const eo = x => 1 - Math.pow(1 - x, 3);
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eob = x => { const c1 = 1.5, c3 = c1 + 1; return x <= 0 ? 0 : 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const frac = x => x - Math.floor(x);
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };
const V = (x, y, z) => new THREE.Vector3(x, y, z);

/* ---------------- renderer ---------------- */
const out = document.getElementById('c'), ctx = out.getContext('2d');
const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = .95;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.localClippingEnabled = true;
const scene = new THREE.Scene();
const BG = new THREE.Color(C.midnight); scene.background = BG;
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
const camera = new THREE.PerspectiveCamera(32, W / H, 0.05, 400);
const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(W, H, { type: THREE.HalfFloatType, samples: 4 }));
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(W / 2, H / 2), .5, .45, 1.0));
composer.addPass(new OutputPass());

/* ---------------- lights ---------------- */
const hemi = new THREE.HemisphereLight(0x9fb8ff, 0x0a0d14, .3); scene.add(hemi);
const key = new THREE.DirectionalLight(0xffffff, 1.6); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); Object.assign(key.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6, near: .5, far: 40 });
key.shadow.bias = -.0004; key.shadow.normalBias = .02; scene.add(key, key.target);
const rim = new THREE.PointLight(0x54d8f2, 10, 18, 2); scene.add(rim);

/* ---------------- materials + helpers ---------------- */
const M = {
  floor: new THREE.MeshStandardMaterial({ color: 0x121a24, roughness: .38, metalness: .3, envMapIntensity: .35 }),
  frame: new THREE.MeshStandardMaterial({ color: 0x2a3343, roughness: .26, metalness: .9, envMapIntensity: .9 }),
  black: new THREE.MeshStandardMaterial({ color: 0x04060a, roughness: .22, metalness: .3 }),
  matte: new THREE.MeshStandardMaterial({ color: 0x1b1f27, roughness: .7, metalness: .1, envMapIntensity: .4 }),
  rubber: new THREE.MeshStandardMaterial({ color: 0x0d0f13, roughness: .9 }),
  clay: new THREE.MeshStandardMaterial({ color: 0xc3cad6, roughness: .6, envMapIntensity: .35 }),
  stone: new THREE.MeshStandardMaterial({ color: 0xd2a874, roughness: .88, metalness: 0, envMapIntensity: .25 }),
  wall: new THREE.MeshStandardMaterial({ color: 0x141b25, roughness: .85 }),
};
const glossy = (c, o = {}) => new THREE.MeshPhysicalMaterial({ color: c, roughness: .25, clearcoat: 1, clearcoatRoughness: .1, envMapIntensity: .55, ...o });
const glow = (c, i = 2.2) => new THREE.MeshStandardMaterial({ color: 0x000000, emissive: c, emissiveIntensity: i, roughness: 1 });
const lineMat = (c = C.cyan, o = 1) => new THREE.LineBasicMaterial({ color: c, transparent: true, opacity: o, toneMapped: false });
const RB = (w, h, d, r = .04, s = 4) => new RoundedBoxGeometry(w, h, d, s, r);
function mesh(geo, mat, pos, o = {}) { const m = new THREE.Mesh(geo, mat); if (pos) m.position.set(...pos); m.castShadow = o.cast !== false; m.receiveShadow = o.recv !== false; return m; }
function canvasTex(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; t.draw = (...a) => { g.clearRect(0, 0, w, h); draw(g, w, h, ...a); t.needsUpdate = true; }; t.draw(0); return t; }
function between(a, b, r, mat, geoFn) {
  const A = V(...a), B = V(...b), len = A.distanceTo(B);
  const m = mesh(geoFn ? geoFn(len) : new THREE.CapsuleGeometry(r, len, 6, 16), mat);
  m.position.copy(A).add(B).multiplyScalar(.5);
  m.quaternion.setFromUnitVectors(V(0, 1, 0), B.clone().sub(A).normalize()); return m;
}
function rr(g, x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }

const floor = mesh(new THREE.CircleGeometry(60, 96), M.floor, null, { cast: false }); floor.rotation.x = -Math.PI / 2; scene.add(floor);

/* deterministic value noise for stone and sand surfaces */
const hash = (x, y) => { const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return n - Math.floor(n); };
function noiseTex(size, base, amp, scale, streak = 0) {
  return canvasTex(size, size, (c, w, h) => {
    const img = c.createImageData(w, h), [r0, g0, b0] = base;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const fx = x / scale, fy = y / (scale * (1 + streak));
      const ix = Math.floor(fx), iy = Math.floor(fy), tx = fx - ix, ty = fy - iy;
      const n = lerp(lerp(hash(ix, iy), hash(ix + 1, iy), tx), lerp(hash(ix, iy + 1), hash(ix + 1, iy + 1), tx), ty) * .7 + hash(x, y) * .3;
      const v = (n - .5) * amp, i = (y * w + x) * 4;
      img.data[i] = r0 + v; img.data[i + 1] = g0 + v * .9; img.data[i + 2] = b0 + v * .8; img.data[i + 3] = 255;
    }
    c.putImageData(img, 0, 0);
  });
}
const STONE_TEX = noiseTex(256, [255, 255, 255], 70, 9, 2.5); STONE_TEX.wrapS = STONE_TEX.wrapT = THREE.RepeatWrapping;
const SAND_TEX = noiseTex(256, [255, 255, 255], 40, 14); SAND_TEX.wrapS = SAND_TEX.wrapT = THREE.RepeatWrapping; SAND_TEX.repeat.set(30, 30);
M.stone.map = STONE_TEX; M.stone.bumpMap = STONE_TEX; M.stone.bumpScale = 1.5;

/* ---------------- shared models ---------------- */
function makePhone(screenMat) {
  const g = new THREE.Group();
  g.add(mesh(RB(.76, 1.56, .085, .1, 6), M.frame));
  g.add(mesh(RB(.72, 1.52, .01, .08, 4), M.black, [0, 0, .039], { cast: false }));
  const scr = mesh(new THREE.PlaneGeometry(.7, 1.5), screenMat, [0, 0, .045], { cast: false }); g.add(scr); g.userData.screen = scr;
  g.add(mesh(RB(.16, .035, .01, .017, 3), M.black, [0, .7, .047], { cast: false }));
  g.add(mesh(RB(.3, .3, .03, .07, 4), M.frame, [-.17, .54, -.055]));
  for (const [x, y] of [[-.235, .6], [-.105, .6], [-.235, .47]]) { const l = mesh(new THREE.CylinderGeometry(.045, .045, .03, 24), M.black, [x, y, -.075]); l.rotation.x = Math.PI / 2; g.add(l); }
  for (const y of [.32, .18]) g.add(mesh(RB(.012, .1, .03, .005, 2), M.frame, [.385, y, 0]));
  return g;
}
/* studio monitor speaker — the AR product (dimensions in metres: 0.34 × 0.52 × 0.30) */
function makeSpeaker() {
  const g = new THREE.Group(), w = .34, h = .52, d = .30;
  const body = glossy(0x1a1d23, { roughness: .45, clearcoat: .4 });
  g.add(mesh(RB(w, h, d, .03, 5), body, [0, h / 2, 0]));
  g.add(mesh(RB(w - .02, h - .02, .01, .025, 3), M.matte, [0, h / 2, d / 2 + .001], { cast: false }));
  const driver = (r, y) => {
    const dg = new THREE.Group(); dg.position.set(0, y, d / 2 + .004);
    const ring = mesh(new THREE.TorusGeometry(r, r * .12, 12, 48), M.frame); dg.add(ring);
    const prof = [[0, -.0], [r * .25, -r * .1], [r * .85, -r * .32], [r * .92, -r * .3]].map(([x, z]) => new THREE.Vector2(x, z));
    const cone = mesh(new THREE.LatheGeometry(prof, 48), M.rubber); cone.rotation.x = -Math.PI / 2; dg.add(cone);
    dg.add(mesh(new THREE.SphereGeometry(r * .28, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2), glossy(0x2b3038), [0, 0, -r * .05])).children;
    dg.children[dg.children.length - 1].rotation.x = Math.PI / 2;
    return dg;
  };
  g.add(driver(.11, .19), driver(.045, .405));
  const port = mesh(new THREE.CylinderGeometry(.022, .022, .02, 24), M.black, [0, .06, d / 2 + .005]); port.rotation.x = Math.PI / 2; g.add(port);
  g.add(mesh(new THREE.CircleGeometry(.006, 16), glow(C.cyan, 3), [.13, .05, d / 2 + .007], { cast: false }));
  return g;
}
/* articulated clay figure; right arm pivots at the shoulder */
function makeFigure(mat) {
  const g = new THREE.Group(), add = m => (g.add(m), m);
  const head = add(mesh(new THREE.SphereGeometry(.112, 32, 24), mat, [0, 1.62, 0])); head.scale.set(1, 1.17, 1.08);
  add(mesh(new THREE.SphereGeometry(.118, 24, 16, 0, Math.PI * 2, 0, Math.PI * .55), M.rubber, [0, 1.65, -.012])).scale.set(1.04, 1.1, 1.12);
  add(mesh(new THREE.SphereGeometry(.05, 16, 12), M.rubber, [0, 1.66, -.11]));
  add(mesh(new THREE.CylinderGeometry(.046, .052, .12, 20), mat, [0, 1.47, 0]));
  const prof = [[0, .88], [.145, .88], [.165, .96], [.145, 1.08], [.13, 1.16], [.155, 1.28], [.195, 1.36], [.2, 1.4], [.155, 1.44], [.055, 1.47], [0, 1.47]].map(([r, y]) => new THREE.Vector2(r, y));
  const shirt = new THREE.MeshStandardMaterial({ color: 0x9aa2ae, roughness: .78 });
  const pants = new THREE.MeshStandardMaterial({ color: 0x2a2d33, roughness: .8 });
  const torso = add(mesh(new THREE.LatheGeometry(prof, 48), shirt)); torso.scale.z = .62;
  const leg = s => { add(between([s * .085, .92, 0], [s * .1, .5, .01], .07, pants)); add(between([s * .1, .5, .01], [s * .1, .09, -.01], .055, pants)); add(mesh(RB(.09, .06, .23, .03, 3), M.rubber, [s * .1, .03, .05])); };
  leg(-1); leg(1);
  // left arm relaxed
  add(between([-.21, 1.38, 0], [-.25, 1.1, .02], .042, shirt)); add(between([-.25, 1.1, .02], [-.27, .86, .06], .034, mat)); add(mesh(new THREE.SphereGeometry(.042, 16, 12), mat, [-.275, .81, .07]));
  // right arm on a shoulder pivot (arm hangs along -y in local space)
  const arm = new THREE.Group(); arm.position.set(.21, 1.38, 0); g.add(arm);
  arm.add(between([0, 0, 0], [.03, -.28, .02], .042, shirt));
  const fore = new THREE.Group(); fore.position.set(.03, -.28, .02); arm.add(fore);
  fore.add(between([0, 0, 0], [.02, -.25, .03], .034, mat));
  const hand = new THREE.Group(); hand.position.set(.02, -.27, .035); fore.add(hand);
  hand.add(mesh(RB(.075, .1, .03, .014, 3), mat, [0, -.04, 0]));
  for (let i = 0; i < 4; i++) hand.add(between([-.027 + i * .018, -.09, 0], [-.03 + i * .02, -.15 + Math.abs(i - 1.5) * .01, 0], .009, mat));
  hand.add(between([.04, -.03, .005], [.07, -.08, .01], .01, mat));
  g.userData = { arm, fore };
  return g;
}

/* ================= SCENES ================= */
const scenes = [];
function def(d) { d.group = new THREE.Group(); d.group.visible = false; scene.add(d.group); d.build(d.group); scenes.push(d); return d; }

/* ---------- S01: the ordinary phone (0–3 s) ---------- */
const S01 = def({
  build(g) {
    this.scr = canvasTex(350, 750, (c, w, h, k) => {
      c.fillStyle = '#020305'; c.fillRect(0, 0, w, h);
      if (k <= 0) return;
      const gr = c.createRadialGradient(w / 2, h * .45, 10, w / 2, h * .45, h * .7);
      gr.addColorStop(0, rgba(C.ice, .7 * k)); gr.addColorStop(.35, rgba(C.cyan, .45 * k)); gr.addColorStop(1, rgba('#0b2a36', k));
      c.fillStyle = gr; c.fillRect(0, 0, w, h);
    });
    this.phone = makePhone(new THREE.MeshBasicMaterial({ map: this.scr }));
    this.phone.rotation.set(-Math.PI / 2, 0, .55); this.phone.position.set(0, .0435, 0); g.add(this.phone);
  },
  update(u) { this.scr.draw(eio(pr(u, 1.9, 2.9))); },
  cam(u) { const k = eio(pr(u, 0, 3)); return { pos: [lerp(1.7, 1.05, k), lerp(3.0, 2.0, k), lerp(3.3, 2.1, k)], look: [0, .02, 0], fov: 40, off: -100 }; },
  light: 'studio', rimPos: [-1.8, 2.6, -2.6],
});

/* ---------- S02: AR product inside the phone camera view (3–8 s) ---------- */
const SPOT = V(0, 0, -1.55);
const S02 = def({
  build(g) {
    // real-world props on the table, seen both directly and through the phone
    g.add(mesh(RB(.5, .03, .36, .01, 2), new THREE.MeshStandardMaterial({ color: 0x31394a, roughness: .7 }), [-.82, .015, -1.25]));
    g.add(mesh(RB(.46, .015, .33, .008, 2), new THREE.MeshStandardMaterial({ color: 0x8e96a3, roughness: .85 }), [-.82, .037, -1.25]));
    g.add(mesh(new THREE.CylinderGeometry(.075, .065, .2, 32), glossy(0xe9edf3), [.78, .1, -1.85]));
    g.add(mesh(new THREE.CylinderGeometry(.11, .1, .2, 32), M.matte, [-.55, .1, -2.4]));
    [[0, .32, 0, .13], [-.06, .4, .04, .09], [.07, .38, -.03, .1]].forEach(([x, y, z, r]) => g.add(mesh(new THREE.SphereGeometry(r, 20, 14), new THREE.MeshStandardMaterial({ color: 0x2f7d5b, roughness: .6 }), [-.55 + x, y, -2.4 + z])));
    // phone on a stand
    this.rt = new THREE.WebGLRenderTarget(540, 1157, { type: THREE.HalfFloatType });
    this.phone = makePhone(new THREE.MeshBasicMaterial({ map: this.rt.texture }));
    this.phone.position.set(0, 1.0, 0); this.phone.rotation.x = -.06; g.add(this.phone);
    g.add(mesh(RB(.5, .06, .3, .025, 3), M.frame, [0, .03, -.02]));
    g.add(between([0, .06, -.06], [0, .24, -.05], .02, M.frame, l => new THREE.CylinderGeometry(.02, .02, l, 16)));
    g.add(mesh(RB(.34, .05, .1, .02, 3), M.frame, [0, .245, .0]));
    // UI overlay drawn on top of the camera feed
    this.ui = canvasTex(540, 1157, (c, w, h, u) => {
      const m = 46, L = 54, k = eo(pr(u, .4, 1.0));
      c.strokeStyle = rgba(C.ice, .85 * k); c.lineWidth = 6;
      for (const [x, y, sx, sy] of [[m, 150, 1, 1], [w - m, 150, -1, 1], [m, h - 210, 1, -1], [w - m, h - 210, -1, -1]]) { c.beginPath(); c.moveTo(x, y + sy * L); c.lineTo(x, y); c.lineTo(x + sx * L, y); c.stroke(); }
      c.font = `600 26px ${FONT}`; c.textAlign = 'center';
      rr(c, w / 2 - 118, 64, 236, 52, 26); c.fillStyle = rgba('#000000', .45 * k); c.fill();
      c.fillStyle = rgba(C.ice, k); c.fillText(u < 1.15 ? 'SCANNING SURFACE' : 'AR VIEW', w / 2, 99);
      if (u > 1.35) { const p = eob(pr(u, 1.35, 1.75)); c.save(); c.translate(w / 2, h - 120); c.scale(p, p);
        rr(c, -150, -34, 300, 68, 34); c.fillStyle = rgba(C.cyan, .92); c.fill(); c.fillStyle = C.midnight; c.font = `600 28px ${FONT}`; c.fillText('PLACED  ✓', 0, 10); c.restore(); }
    });
    g.add(mesh(new THREE.PlaneGeometry(.7, 1.5), new THREE.MeshBasicMaterial({ map: this.ui, transparent: true, toneMapped: false, depthWrite: false }), null, { cast: false }));
    this.uiPlane = g.children[g.children.length - 1];
    // AR-only layer: rendered into the phone feed, never in the main view
    this.ar = new THREE.Group(); this.ar.position.copy(SPOT); scene.add(this.ar); this.ar.visible = false;
    this.speaker = makeSpeaker(); this.ar.add(this.speaker);
    this.reticle = mesh(new THREE.TorusGeometry(.28, .008, 8, 96), glow(C.cyan, 2.4), [0, .006, 0], { cast: false }); this.reticle.rotation.x = Math.PI / 2; this.ar.add(this.reticle);
    this.reticleDot = mesh(new THREE.CircleGeometry(.025, 32), glow(C.cyan, 2.4), [0, .007, 0], { cast: false }); this.reticleDot.rotation.x = -Math.PI / 2; this.ar.add(this.reticleDot);
    this.ring = mesh(new THREE.TorusGeometry(.3, .006, 8, 96), new THREE.MeshBasicMaterial({ color: C.cyan, transparent: true, toneMapped: false }), [0, .01, 0], { cast: false }); this.ring.rotation.x = Math.PI / 2; this.ar.add(this.ring);
    this.feedCam = new THREE.PerspectiveCamera(52, .7 / 1.5, .05, 60);
  },
  update(u) {
    this.ui.draw(u);
    this.uiPlane.position.copy(this.phone.localToWorld(V(0, 0, .047))); this.uiPlane.quaternion.copy(this.phone.quaternion);
    const ret = pr(u, .4, .8) * (1 - pr(u, 1.15, 1.35));
    this.reticle.visible = this.reticleDot.visible = ret > 0;
    this.reticle.scale.setScalar(lerp(1.15, 1, eo(pr(u, .4, .8))) * (1 + .04 * Math.sin(u * Math.PI * 4)));
    const kp = pr(u, 1.15, 1.6);
    this.speaker.visible = kp > 0; this.speaker.scale.setScalar(Math.max(.001, eob(kp)));
    this.speaker.rotation.y = lerp(-.55, .45, eio(pr(u, 1.3, 4.6)));
    const kr = pr(u, 1.15, 1.75); this.ring.visible = kr > 0 && kr < 1; this.ring.scale.setScalar(1 + kr * 1.4); this.ring.material.opacity = 1 - kr;
  },
  preRender() {
    // phone's rear camera looks over the table at the AR spot
    this.phone.updateMatrixWorld(true);
    this.feedCam.position.copy(this.phone.localToWorld(V(-.17, .54, -.09)));
    this.feedCam.lookAt(SPOT.x, .2, SPOT.z);
    this.phone.visible = false; this.uiPlane.visible = false; this.ar.visible = true;
    renderer.setRenderTarget(this.rt); renderer.render(scene, this.feedCam); renderer.setRenderTarget(null);
    this.phone.visible = true; this.uiPlane.visible = true; this.ar.visible = false;
  },
  cam(u) {
    const k = eio(pr(u, 0, 4.2)), z = eio(pr(u, 4.25, 5));
    const p = [lerp(1.15, .45, k), lerp(1.4, 1.15, k), lerp(4.4, 3.25, k)];
    return { pos: [lerp(p[0], 0, z), lerp(p[1], 1.0, z), lerp(p[2], .95, z)], look: [0, lerp(.95, 1.0, z), 0], fov: 40, off: lerp(-110, 0, z) };
  },
  light: 'studio', rimPos: [1.6, 1.8, -2.2],
});

/* ---------- S03: product wireframe becomes an interactive display (8–10 s) ---------- */
const DISP = { w: 1.0, h: 2.0, d: .09 };
const S03 = def({
  build(g) {
    this.box = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(1, 1, 1)), lineMat()); g.add(this.box);
    this.grid = new THREE.Group(); g.add(this.grid);
    const gl = []; for (let i = 1; i < 6; i++) { const y = i / 6 - .5; gl.push(-.5, y, .5, .5, y, .5, .5, y, .5, .5, y, -.5); } for (let i = 1; i < 4; i++) { const x = i / 4 - .5; gl.push(x, -.5, .5, x, .5, .5); }
    const gg = new THREE.BufferGeometry(); gg.setAttribute('position', new THREE.Float32BufferAttribute(gl, 3));
    this.gridLines = new THREE.LineSegments(gg, lineMat(C.cyan, .35)); this.grid.add(this.gridLines);
    const circ = (r, n = 64) => { const p = []; for (let i = 0; i <= n; i++) { const a = i / n * Math.PI * 2; p.push(Math.cos(a) * r, Math.sin(a) * r, 0); } const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.Float32BufferAttribute(p, 3)); return geo; };
    this.drivers = new THREE.Group(); g.add(this.drivers);
